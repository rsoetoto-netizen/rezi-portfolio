media:
  - name: images
    label: Images
    input: images
    output: /images

content:
  - name: bio
    label: Website Content (Bio, Skills, Languages, Contact & Meme)
    type: file
    path: site.json
    format: json
    fields:
      - name: bio
        label: Bio
        type: object
        fields:
          - name: photo
            label: Profile photo
            type: image
          - name: headline
            label: Headline
            type: string
          - name: subheadline
            label: Subheadline
            type: string
          - name: description
            label: Bio description
            type: text

      - name: skills
        label: Skills
        type: object
        list: true
        fields:
          - name: group
            label: Skill Category
            type: string
            required: true
          - name: items
            label: Skills in this category
            type: string
            list: true

      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - name: name
            label: Language
            type: string
            required: true
          - name: proficiency
            label: Proficiency
            type: string
          - name: level
            label: CEFR Level (optional)
            type: string
          - name: certificate_name
            label: Certificate Name
            type: string
          - name: certificate_url
            label: Certificate URL (Duolingo, IELTS, etc.)
            type: string

      - name: contact
        label: Contact
        type: object
        fields:
          - name: headline
            label: Contact heading
            type: string
          - name: description
            label: Contact description
            type: text
          - name: email
            label: Email address
            type: string
          - name: whatsapp
            label: WhatsApp number (e.g. 62812...)
            type: string
          - name: linkedin
            label: LinkedIn profile URL
            type: string
          - name: cv_url
            label: CV Google Drive URL (share link)
            type: string

      - name: meme
        label: Meme next to contact
        type: object
        fields:
          - name: image
            label: Meme image
            type: image
          - name: caption
            label: Meme caption (optional)
            type: string

  - name: campaigns
    label: Campaigns
    type: file
    path: campaigns.json
    format: json
    list: true
    fields:
      - name: name
        label: Campaign name
        type: string
        required: true
      - name: industry
        label: Industry
        type: string
      - name: start
        label: Start date
        type: date
        required: true
      - name: ongoing
        label: Still ongoing
        type: boolean
      - name: end
        label: End date
        type: date
      - name: logo
        label: Logo
        type: image
      - name: color
        label: 'Card color (optional, e.g. #f3e51c)'
        type: string
      - name: overview
        label: Overview
        type: rich-text
        options:
          format: html
          media: false
      - name: challenges
        label: Challenges
        type: rich-text
        options:
          format: html
          media: false
      - name: participants
        label: Participants
        type: rich-text
        options:
          format: html
          media: false
      - name: role
        label: What I did
        type: rich-text
        options:
          format: html
          media: false
      - name: gallery
        label: Visual campaign (multiple images)
        type: image
        options:
          multiple:
            max: 12
      - name: results
        label: Results
        type: rich-text
        options:
          format: html
          media: false

  - name: experience
    label: Work Experience
    type: file
    path: experience.json
    format: json
    list: true
    fields:
      - name: company
        label: Company name
        type: string
        required: true
      - name: positions
        label: Positions at this company
        type: object
        list: true
        fields:
          - name: title
            label: Job title
            type: string
            required: true
          - name: period
            label: Employment period (e.g. Jan 2021 - Mar 2024)
            type: string
          - name: agency
            label: Agency, client, or affiliation (optional)
            type: string
          - name: brands
            label: Brands handled (optional)
            type: text
          - name: description
            label: Role description (optional)
            type: rich-text
            options:
              format: html
              media: false

  - name: tools
    label: Tools
    type: file
    path: tools.json
    format: json
    list: true
    fields:
      - name: group
        label: Group (e.g. Digital marketing)
        type: string
        required: true
      - name: name
        label: Tool name
        type: string
        required: true
      - name: logo
        label: Logo (use transparent PNG/WebP/SVG)
        type: image
